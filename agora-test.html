<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>agora-test</title>
<style>body{font:16px/1.6 -apple-system,sans-serif;padding:24px}#s{white-space:pre-wrap;word-break:break-all}</style>
</head>
<body>
<div id="s">loading</div>
<script src="./agora.js"></script>
<script>
(function () {
  var el = document.getElementById('s')
  if (!window.AgoraRTC) { el.textContent = 'SDK_NOT_LOADED'; return }
  var c = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' })
  var uid = Math.floor(Math.random() * 100000) + 1
  var ch = 'lgtest' + Date.now().toString(36)
  el.textContent = 'joining...'
  c.join('7bec2e5a65b5473aaed7b65abb773cc0', ch, null, uid).then(function () {
    el.textContent = 'JOIN_OK uid=' + uid + ' channel=' + ch
    setTimeout(function () { c.leave() }, 1500)
  }).catch(function (e) {
    el.textContent = 'JOIN_FAIL ' + (e && (e.code || e.name)) + ' :: ' + (e && e.message)
  })
})()
</script>
</body>
</html>
