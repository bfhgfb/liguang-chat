<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>agora-test</title>
<style>body{font:15px/1.6 -apple-system,sans-serif;padding:20px}#s{white-space:pre-wrap;word-break:break-all}</style>
</head>
<body>
<div id="s">loading</div>
<script src="./agora.js"></script>
<script>
(function () {
  var el = document.getElementById('s'), out = []
  function log(x) { out.push(x); el.textContent = out.join('\n') }
  if (!window.AgoraRTC) { log('SDK_NOT_LOADED'); return }
  log('SDK ' + (AgoraRTC.VERSION || '?'))
  var APP = '7bec2e5a65b5473aaed7b65abb773cc0'
  function attempt(label, token, uid) {
    var c = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' })
    var ch = 'lgt' + Date.now().toString(36) + Math.floor(Math.random() * 1000)
    return c.join(APP, ch, token, uid).then(function () {
      log(label + ' => JOIN_OK')
      return c.leave()
    }).catch(function (e) {
      log(label + ' => FAIL ' + (e && (e.code || e.name)) + ' :: ' + (e && e.message))
    })
  }
  var uid = Math.floor(Math.random() * 100000) + 1
  attempt('null', null, uid)
    .then(function () { return attempt('undefined', undefined, uid) })
    .then(function () { return attempt('empty', '', uid) })
    .then(function () { log('DONE') })
})()
</script>
</body>
</html>
