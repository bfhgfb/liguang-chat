<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>方案 D · 极简图标</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0d1620;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif}
.phone{position:relative;width:390px;height:844px;overflow:hidden;border-radius:44px;
 background:linear-gradient(175deg,#F2F9FF 0%,#FBFDFF 40%,#EAF3FE 74%,#DCEDFF 100%);color:#0F2237}
.phone:before{content:"";position:absolute;width:460px;height:460px;left:-180px;top:-180px;border-radius:50%;
 background:radial-gradient(circle,rgba(125,195,255,.38),transparent 67%)}
.phone:after{content:"";position:absolute;width:340px;height:340px;right:-160px;bottom:60px;border-radius:50%;
 background:radial-gradient(circle,rgba(160,150,255,.26),transparent 70%)}
.status{position:relative;z-index:5;display:flex;justify-content:space-between;padding:16px 30px 0;font-size:13px;font-weight:600}
.status .r{font-size:11px;letter-spacing:1px}
.screen{position:relative;z-index:2;height:calc(100% - 34px)}
.head{padding:18px 24px 4px;display:flex;align-items:flex-start}
.head h1{margin:0;font-size:31px;font-weight:700;letter-spacing:.5px}
.head .sub{font-size:12px;color:#7C93A8;margin-top:6px}
.head .acts{margin-left:auto;display:flex;gap:10px;padding-top:4px}
.ib{width:38px;height:38px;border-radius:13px;background:rgba(255,255,255,.66);border:1px solid rgba(255,255,255,.9);
 display:flex;align-items:center;justify-content:center;color:#41586E;box-shadow:0 6px 16px rgba(80,130,180,.10)}

.list{padding:10px 16px 0;display:flex;flex-direction:column;gap:2px}
.row{display:flex;align-items:center;gap:14px;padding:13px 10px;border-radius:18px}
.row.hl{background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9);box-shadow:0 6px 20px rgba(80,130,180,.09)}
.ava{width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex:0 0 48px}
.a1{background:linear-gradient(135deg,#7FC5FF,#4E9AF0)}.a2{background:linear-gradient(135deg,#B7A6FF,#7C7BF6)}
.a3{background:linear-gradient(135deg,#8EE3C6,#41B99A)}.a4{background:linear-gradient(135deg,#FFC58A,#F0904C)}
.mid{flex:1;min-width:0}
.nm{font-size:15.5px;font-weight:600;display:flex;align-items:center;gap:6px}
.tag{font-size:10px;color:#4C8FD6;background:rgba(120,180,255,.18);padding:2px 6px;border-radius:7px}
.pv{font-size:12.5px;color:#7C93A8;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.tm{font-size:11px;color:#9AAFC2}
.dot{width:8px;height:8px;border-radius:4px;background:#4C9BF5;box-shadow:0 0 0 4px rgba(76,155,245,.14)}

.nav{position:absolute;left:20px;right:20px;bottom:24px;height:70px;z-index:5}
.nav:before{content:"";position:absolute;inset:0;border-radius:26px;background:rgba(255,255,255,.72);
 border:1px solid rgba(255,255,255,.95);backdrop-filter:blur(20px) saturate(170%);
 box-shadow:0 16px 36px rgba(60,110,170,.20)}
.items{position:relative;height:100%;display:flex;align-items:center;justify-content:space-around;padding:0 6px;color:#8FA5B8}
.item{width:46px;height:46px;display:flex;align-items:center;justify-content:center;position:relative}
.item.on{color:#1C7FE0}
.item.on:after{content:"";position:absolute;bottom:-1px;width:5px;height:5px;border-radius:3px;background:#4C9BF5}
.center{width:60px;height:60px;border-radius:22px;margin-top:-26px;
 background:linear-gradient(145deg,#6FC0FF,#4A8DF7);color:#fff;display:flex;align-items:center;justify-content:center;
 border:2px solid rgba(255,255,255,.8);box-shadow:0 12px 26px rgba(60,130,230,.42)}
.center svg{width:26px;height:26px}
.hint{position:absolute;left:24px;right:24px;bottom:104px;text-align:center;font-size:10.5px;color:#9AAFC2;letter-spacing:.3px}
@media(max-width:430px){.phone{width:100vw;height:100vh;border-radius:0}}
</style>
</head>
<body>
<div class="phone">
  <div class="status"><span>9:41</span><span class="r">▲▮ 5G ▮</span></div>
  <div class="screen">
    <div class="head">
      <div>
        <h1>消息</h1>
        <div class="sub">3 个会话有新消息</div>
      </div>
      <div class="acts">
        <div class="ib"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg></div>
        <div class="ib"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></div>
      </div>
    </div>

    <div class="list">
      <div class="row hl">
        <div class="ava a1">杜</div>
        <div class="mid"><div class="nm">小杜官方 <span class="tag">官方</span></div><div class="pv">欢迎来到小杜，有什么想说的都可以跟我说</div></div>
        <div class="rt"><span class="tm">刚刚</span><span class="dot"></span></div>
      </div>
      <div class="row">
        <div class="ava a2">林</div>
        <div class="mid"><div class="nm">林小满</div><div class="pv">晚上一起吃饭吗？</div></div>
        <div class="rt"><span class="tm">18:42</span><span class="dot"></span></div>
      </div>
      <div class="row">
        <div class="ava a3">周末</div>
        <div class="mid"><div class="nm">周末爬山群 <span class="tag">12</span></div><div class="pv">阿杜：我带水，你们带点吃的</div></div>
        <div class="rt"><span class="tm">17:05</span></div>
      </div>
      <div class="row">
        <div class="ava a4">陈</div>
        <div class="mid"><div class="nm">陈一鸣</div><div class="pv">[语音] 12″</div></div>
        <div class="rt"><span class="tm">昨天</span><span class="dot" style="background:#A9BCCC;box-shadow:0 0 0 4px rgba(169,188,204,.14)"></span></div>
      </div>
    </div>

    <div class="hint">底部只有图标 · 中间是小杜 AI · 可在设置里打开文字</div>
    <div class="nav">
      <div class="items">
        <div class="item on"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.6c0 4-3.8 7.2-8.5 7.2-1 0-2-.1-2.9-.4L4 20.5l1.3-3.4C4.1 15.8 3.5 13.8 3.5 11.6c0-4 3.8-7.2 8.5-7.2s8.5 3.2 8.5 7.2z"/></svg></div>
        <div class="item"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8.5" r="3.4"/><path d="M3.4 19.5c0-3 2.5-5.1 5.6-5.1s5.6 2.1 5.6 5.1"/><path d="M16 5.6a3.2 3.2 0 010 6"/><path d="M17.4 14.9c2 .5 3.5 2.1 3.5 4.6"/></svg></div>
        <div class="center"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 4.6L18.5 9.5l-4.6 1.9L12 16l-1.9-4.6L5.5 9.5l4.6-1.9L12 3z"/><path d="M18.5 15.5l.9 2.1 2.1.9-2.1.9-.9 2.1-.9-2.1-2.1-.9 2.1-.9.9-2.1z"/></svg></div>
        <div class="item"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"/><circle cx="12" cy="12" r="3.8"/><circle cx="17.2" cy="6.8" r="1.1" fill="currentColor" stroke="none"/></svg></div>
        <div class="item"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.2c0-3.6 3.2-6.2 7.2-6.2s7.2 2.6 7.2 6.2"/></svg></div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
