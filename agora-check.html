<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="utf-8"><title>agora-check</title>
<style>body{font:14px/1.6 -apple-system,sans-serif;padding:16px}#s{white-space:pre-wrap;word-break:break-all}</style>
</head>
<body>
<div id="s">loading</div>
<script>
window.__AGORA_APP_ID__ = "7bec2e5a65b5473aaed7b65abb773cc0";
window.__AGORA_APP_CERT__ = "416f63068ac1491a81f9646b3c04cd97";
function lgAgoraAppId(){ return window.__AGORA_APP_ID__ }
/* 在手机本地生成声网 Token（需要 window.__AGORA_APP_CERT__） */
function lgB64(t) {
    var e = "";
    for (var r = 0; r < t.length; r++) e += String.fromCharCode(t[r]);
    return btoa(e)
}

function lgU16(t) {
    return new Uint8Array([t & 255, t >>> 8 & 255])
}

function lgU32(t) {
    return new Uint8Array([t & 255, t >>> 8 & 255, t >>> 16 & 255, t >>> 24 & 255])
}

function lgCat(t) {
    var e = 0,
        r = 0;
    for (r = 0; r < t.length; r++) e += t[r].length;
    for (var n = new Uint8Array(e), s = 0, r = 0; r < t.length; r++) n.set(t[r], s), s += t[r].length;
    return n
}

function lgStr(t) {
    var e = new TextEncoder().encode(t);
    return lgCat([lgU16(e.length), e])
}

async function lgHmac(t, e) {
    var r = await crypto.subtle.importKey("raw", t, {
        name: "HMAC",
        hash: "SHA-256"
    }, !1, ["sign"]);
    return new Uint8Array(await crypto.subtle.sign("HMAC", r, e))
}

async function lgDeflate(t) {
    var e = new CompressionStream("deflate");
    return new Uint8Array(await new Response(new Blob([t]).stream().pipeThrough(e)).arrayBuffer())
}

async function lgAgoraToken(ch, uid, exp) {
    var cert = String(window.__AGORA_APP_CERT__ || "");
    if (!cert) return "";
    var ts = Math.floor(Date.now() / 1e3),
        salt = Math.floor(Math.random() * 99999999) + 1,
        priv = ts + exp,
        s0 = await lgHmac(lgU32(ts), new TextEncoder().encode(cert)),
        signing = await lgHmac(lgU32(salt), s0),
        svc = lgCat([lgU16(1), lgU16(4), lgU16(1), lgU32(priv), lgU16(2), lgU32(priv), lgU16(3), lgU32(priv), lgU16(4), lgU32(priv), lgStr(ch), lgStr(uid ? String(uid) : "")]),
        info = lgCat([lgStr(lgAgoraAppId()), lgU32(ts), lgU32(exp), lgU32(salt), lgU16(1), svc]),
        sig = await lgHmac(signing, info);
    return "007" + lgB64(await lgDeflate(lgCat([lgCat([lgU16(sig.length), sig]), info])))
}


</script>
<script src="./agora.js"></script>
<script>
(async function () {
  var el = document.getElementById('s'), out = []
  function log(x) { out.push(x); el.textContent = out.join('\n') }
  log('SDK ' + (AgoraRTC.VERSION || '?'))
  var ch = 'lgc' + Date.now().toString(36)
  var uid = Math.floor(Math.random() * 100000) + 1
  var c = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' })
  try {
    var tk = await lgAgoraToken(ch, uid, 3600)
    log('TOKEN len=' + tk.length + ' ' + tk.slice(0, 28) + '...')
    await c.join(window.__AGORA_APP_ID__, ch, tk, uid)
    log('JOIN_OK uid=' + uid)
    try {
      var cv = document.createElement('canvas'); cv.width = 320; cv.height = 240
      var cx = cv.getContext('2d')
      var n = 0
      var timer = setInterval(function () { n++; cx.fillStyle = n % 2 ? '#f00' : '#0f0'; cx.fillRect(0, 0, 320, 240) }, 300)
      var ac = new (window.AudioContext || window.webkitAudioContext)()
      var dst = ac.createMediaStreamDestination()
      var vms = cv.captureStream(5)
      var vt = AgoraRTC.createCustomVideoTrack({ mediaStreamTrack: vms.getVideoTracks()[0] })
      var at = AgoraRTC.createCustomAudioTrack({ mediaStreamTrack: dst.stream.getAudioTracks()[0] })
      await c.publish([vt, at])
      log('PUBLISH_OK')
      clearInterval(timer)
    } catch (pe) {
      log('PUBLISH_FAIL ' + (pe && (pe.code || pe.name)) + ' :: ' + (pe && pe.message))
    }
    await c.leave()
  } catch (e) {
    log('FAIL ' + (e && (e.code || e.name)) + ' :: ' + (e && e.message))
  }
  log('DONE')
})()
</script>
</body>
</html>
